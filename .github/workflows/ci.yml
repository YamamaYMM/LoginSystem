name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      BASE_URL: http://127.0.0.1:8000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: logindatabase_test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: logindatabase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json

      - name: Check PHP syntax
        run: |
          find . -maxdepth 3 -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Initialize test database and tables
        run: |
          php -r '
          $host = getenv("DB_HOST") ?: "127.0.0.1";
          $port = getenv("DB_PORT") ?: "3306";
          $user = getenv("DB_USER") ?: "root";
          $pass = getenv("DB_PASS") ?: "root";
          $db   = getenv("DB_NAME") ?: "logindatabase_test";

          $pdo = new PDO("mysql:host={$host};port={$port};charset=utf8mb4", $user, $pass, [
              PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
          ]);
          $pdo->exec("CREATE DATABASE IF NOT EXISTS `{$db}` CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci");
          $pdo->exec("USE `{$db}`");
          $pdo->exec("
              CREATE TABLE IF NOT EXISTS `users` (
                  `id` VARCHAR(64) NOT NULL PRIMARY KEY,
                  `name` VARCHAR(100) NOT NULL UNIQUE,
                  `password_hash` VARCHAR(255) NOT NULL,
                  `role` ENUM(\x27master\x27, \x27submaster\x27, \x27general\x27) NOT NULL DEFAULT \x27general\x27,
                  `is_manager` TINYINT(1) NOT NULL DEFAULT 0,
                  `created_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4
          ");
          $pdo->exec("
              CREATE TABLE IF NOT EXISTS `logintable` (
                  `name` VARCHAR(255) NOT NULL,
                  `id` VARCHAR(255) NOT NULL,
                  `password` VARCHAR(255) NOT NULL,
                  `time` VARCHAR(255) NOT NULL
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4
          ");
          echo "DB initialized successfully.\n";
          '

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start PHP server for E2E
        run: |
          php -S 127.0.0.1:8000 -t /home/runner/work/LoginSystem/LoginSystem >/tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/auth_api.php >/dev/null; then
              break
            fi
            sleep 0.5
          done

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: |
          init_db() {
            php -r '
            $host = getenv("DB_HOST") ?: "127.0.0.1";
            $port = getenv("DB_PORT") ?: "3306";
            $user = getenv("DB_USER") ?: "root";
            $pass = getenv("DB_PASS") ?: "root";
            $db   = getenv("DB_NAME") ?: "logindatabase_test";
            $pdo = new PDO("mysql:host={$host};port={$port};charset=utf8mb4", $user, $pass, [
                PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
            ]);
            $pdo->exec("CREATE DATABASE IF NOT EXISTS `{$db}` CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci");
            $pdo->exec("USE `{$db}`");
            $pdo->exec("CREATE TABLE IF NOT EXISTS `users` (`id` VARCHAR(64) NOT NULL PRIMARY KEY, `name` VARCHAR(100) NOT NULL UNIQUE, `password_hash` VARCHAR(255) NOT NULL, `role` ENUM(\x27master\x27, \x27submaster\x27, \x27general\x27) NOT NULL DEFAULT \x27general\x27, `is_manager` TINYINT(1) NOT NULL DEFAULT 0, `created_at` TIMESTAMP DEFAULT CURRENT_TIMESTAMP) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4");
            $pdo->exec("CREATE TABLE IF NOT EXISTS `logintable` (`name` VARCHAR(255) NOT NULL, `id` VARCHAR(255) NOT NULL, `password` VARCHAR(255) NOT NULL, `time` VARCHAR(255) NOT NULL) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4");
            '
          }

          for spec in tests/*.spec.ts; do
            echo "=== Running $spec ==="
            init_db
            npx playwright test "$spec"
          done
        working-directory: /home/runner/work/LoginSystem/LoginSystem/e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
