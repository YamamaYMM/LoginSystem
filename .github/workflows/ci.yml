name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: logindatabase
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_NAME: logindatabase
      DB_USER: root
      DB_PASS: root_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, mbstring

      - name: PHP syntax check
        run: find . -path './vendor' -prune -o -path './e2e/node_modules' -prune -o -name '*.php' -exec php -l {} +

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h "$DB_HOST" -u"$DB_USER" -p"$DB_PASS" --silent; then
              break
            fi
            sleep 1
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start PHP server and run Playwright E2E tests
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000/
        run: |
          php -S 127.0.0.1:8000 -t .. >/tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8000/ >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

          npx playwright test --workers=1 --reporter=list